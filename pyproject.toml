[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-mind"
version = "0.1.0"
description = "Universal Mind — a seed-core, local-first orchestration system (Core / Pantheon / Memory / Feedback / ARETE / Gateway)."
readme = "universal_mind/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Universal Mind" }]
keywords = ["orchestration", "capabilities", "memory", "seed-core"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy", "matplotlib", "pandas", "scikit-learn", "openpyxl", "Pillow",
  "reportlab", "python-dateutil", "persiantools", "arabic-reshaper",
  "python-bidi", "uvicorn", "fastapi", "pystray", "keyboard", "requests",
]

[project.scripts]
universal-mind = "universal_mind.cli:main"

[tool.setuptools.packages.find]
include = ["universal_mind*"]

# R74 seal run 3 — THE ROOTDIR ANCHOR: a foreign /d/workspaces/setup.cfg
# (written by another process, legacy [pytest] section — hard-fail in
# pytest 8) sat ABOVE our tree's search path because this pyproject had
# no [tool:pytest] section to anchor pytest's rootdir. Anchoring here
# makes our repo self-contained: the config search stops at OUR root.
[tool.setuptools.package-data]
universal_mind = ["tools/volctl.exe"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["universal_mind/tests"]
addopts = "-p no:cacheprovider"

[tool.ruff.lint]
# Pin the lint surface against target-version auto-enablement. Declaring
# `requires-python` makes ruff auto-selected pyupgrade/simplify preview rules
# (UP017 timezone.utc→UTC, SIM117 merge-with) across long-standing committed
# files. Those are stylistic churn, not defects, so keep them off and keep the
# repo's established green-lint baseline stable.
#
# E402/E712/E731/E741: pre-existing intentional patterns in the suite (lazy
# imports after logger setup in executive.py, script probes' explicit
# `== True/False` readability checks, test lambdas, `l` loop vars). Newer ruff
# releases started enabling these E-rules by default; they flag long-standing
# style, not defects, so they stay ignored to keep the baseline stable.
ignore = ["UP017", "SIM117", "E402", "E712", "E731", "E741", "E702"]