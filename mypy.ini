[mypy]
strict = True
warn_unused_ignores = True
disallow_untyped_defs = True
python_version = 3.12


[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-pypdf.*]
# pypdf ships no type stubs; exercised by real read tests.
ignore_missing_imports = True
follow_imports = skip

[mypy-openpyxl.*]
# openpyxl ships no type stubs; its API is stable and exercised by real tests.
ignore_missing_imports = True
follow_imports = skip

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy.universal_mind.*]
strict = True
warn_unused_ignores = True
disallow_untyped_defs = True

[mypy.universal_mind.tests.*]
# Tests can be less strict for testing purposes
ignore_errors = False